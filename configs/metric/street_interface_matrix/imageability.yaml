# A metric system's settings, under `metric`: read by src/metric/street_interface_matrix/. Any metric
# system's config gives `dimensions` (with their indicators) and `names`, which the analysis reads.

# --- metric (compose_metric): the Street Interface Matrix with the Imageability terms. M = (Identity x Dependence x
# Comfort)^(1/3),
# the draft's three pillars with the least change: the old Imageability (greenery) renamed Comfort for what it holds,
# GFAPI moved to Dependence (as the draft's Appendix A rated it), every other earlier term in its pillar, and each new
# term beside the earlier terms it extends.
# An indicator is scaled between fixed goalposts, as in the Human Development Index: its ratings between rungs 1 and 7
# (rating_goalposts [7, 1] counts downward) and averaged; its record between goalposts [worst, best] (ln(1 + x) where
# log: true). With both, the indicator is half the ratings, half the record. A pillar is 1 + 6 x the mean of its
# indicators. 29 of the 31 rated terms enter; enclosure (building height) and v_built (only ever the greenery ratio's
# denominator) are checks in step validate_vlm_ratings (validation). Other designs were compared on the same ratings:
# docs/experiment-notes.md (Metric).
metric:
  names: {identity: Identity, dependence: Dependence, comfort: Comfort}
  dimensions:
    identity:                 # the setting's distinct, legible character (Lynch's identity; Ewing's imageability)
      - {name: distinctiveness, ratings: [distinctiveness]}
      - {name: visual_richness, ratings: [visual_richness, v_sign]}
      - {name: historic_fabric, ratings: [historic_character], record: median_building_year, goalposts: [2020, 1900]}
      - {name: cultural_anchors, ratings: [cultural_anchors], record: cultural_anchor_count, goalposts: [0, 3], log: true}
      - {name: street_wall, ratings: [street_wall_continuity], record: street_wall_share, goalposts: [0, 1]}
      - {name: building_grain, ratings: [building_grain], record: buildings_fronting, goalposts: [1, 15], log: true}
      - {name: outdoor_room, ratings: [outdoor_room]}   # Lynch's closure
    dependence:               # what the street offers to do and use (Williams and Vaske; Mehta; Gehl)
      - {name: active_frontage, ratings: [frontage_engagement, gfapi, shopfronts], record: storefronts, goalposts: [0, 6], log: true}
      - {name: few_vacancies, ratings: [vacant_shopfronts], rating_goalposts: [7, 1], record: vacant_storefront_share, goalposts: [1, 0]}
      - {name: places_to_sit, ratings: [sittability, ias, public_seating], record: seating_public, goalposts: [0, 3], log: true}
      - {name: commercial_seating, ratings: [cafe_seating, business_spill_out], record: seating_cafes, goalposts: [0, 3], log: true}
      - {name: room_to_stop, ratings: [pause_invitation, setback_space], record: setback_m, goalposts: [0, 10]}
      - {name: sidewalk, ratings: [sidewalk_width], record: sidewalk_width_m, goalposts: [1.5, 8]}
      - {name: clear_path, ratings: [v_pave], record: active_sidewalk_shed, goalposts: [1, 0]}
      - {name: open_space, ratings: [open_space], record: open_space_distance_m, goalposts: [300, 0]}
      - {name: transit_access, ratings: [transit_entrance], record: subway_distance_m, goalposts: [800, 0]}
    comfort:                  # conditions that make staying pleasant (the draft's Imageability: eye-level nature)
      - {name: greenery_cover, ratings: [v_nat], record: GVI, goalposts: [0, 30]}           # segmented, % of the view
      - {name: eye_level_greenery, ratings: [gvi_eye, gmi], record: GVI_eye_seg, goalposts: [0, 15]}
      - {name: street_trees, ratings: [street_trees], record: street_tree_count, goalposts: [0, 8], log: true}
      - {name: protected_edge, ratings: [protected_edge]}
      - {name: human_scale, ratings: [human_scale]}
  section_crossing_m: 15      # nodes this close to another street are at a crossing
